<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#070605">
<title>Presente Especial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold-100: #fff8d6;
    --gold-300: #ffd85c;
    --gold-500: #e5a922;
    --gold-700: #8f5c06;
    --bg-dark: #070605;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 42%, #472b09 0%, #180f04 45%, #050403 88%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    user-select: none;
    touch-action: manipulation;
}

/* Vinheta cinematográfica */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 48%, rgba(0, 0, 0, 0.78) 100%);
    pointer-events: none;
    z-index: 2;
}

#fx-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
}

.screen-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 48%, #ffffff, #fff2ad 34%, #ffb829 66%, transparent 92%);
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}

.screen-flash.active {
    opacity: 0.94;
}

.container {
    width: 100%;
    max-width: 470px;
    padding: 16px 20px 20px;
    text-align: center;
    position: relative;
    z-index: 10;
}

/* Barra de urgência VIP no topo */
.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    margin-bottom: 12px;
    border-radius: 999px;
    font-size: 11.5px;
    font-weight: 700;
    letter-spacing: 0.7px;
    color: var(--gold-100);
    background: rgba(255, 211, 77, 0.09);
    border: 1px solid rgba(255, 211, 77, 0.3);
    backdrop-filter: blur(10px);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.4), 0 0 18px rgba(255, 200, 60, 0.12);
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #4ade80;
    box-shadow: 0 0 10px #4ade80;
    animation: dotPulse 1.5s ease-in-out infinite;
    flex-shrink: 0;
}

.timer-pill {
    color: #ffd85c;
    font-variant-numeric: tabular-nums;
    font-weight: 800;
}

h1 {
    font-size: clamp(24px, 6.4vw, 34px);
    font-weight: 850;
    line-height: 1.15;
    margin-bottom: 9px;
    letter-spacing: -0.5px;
}

h1 span {
    background: linear-gradient(135deg, #fff9d2 0%, #ffd34d 45%, #e39512 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 22px rgba(255, 196, 46, 0.38));
}

.subtitle {
    color: #c2b9ab;
    font-size: 14.5px;
    line-height: 1.5;
    max-width: 345px;
    margin: 0 auto;
}

/* Palco 3D */
.gift-stage {
    position: relative;
    height: 345px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 2px 0 6px;
    perspective: 950px;
}

.aura-rays {
    position: absolute;
    width: 380px;
    height: 380px;
    border-radius: 50%;
    background: conic-gradient(
        from 0deg,
        transparent 0deg 18deg,
        rgba(255, 206, 72, 0.14) 28deg,
        transparent 44deg 74deg,
        rgba(255, 206, 72, 0.10) 90deg,
        transparent 110deg 145deg,
        rgba(255, 206, 72, 0.15) 160deg,
        transparent 180deg 215deg,
        rgba(255, 206, 72, 0.11) 235deg,
        transparent 255deg 290deg,
        rgba(255, 206, 72, 0.14) 310deg,
        transparent 335deg 360deg
    );
    -webkit-mask-image: radial-gradient(circle, black 16%, transparent 66%);
    mask-image: radial-gradient(circle, black 16%, transparent 66%);
    animation: spinSlow 18s linear infinite;
    pointer-events: none;
}

.aura-glow {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 196, 46, 0.32) 0%, rgba(255, 140, 0, 0.1) 46%, transparent 74%);
    filter: blur(22px);
    pointer-events: none;
    animation: glowPulse 3s ease-in-out infinite;
}

/* Anéis orbitais 3D em volta da caixa */
.orbit-plane {
    position: absolute;
    width: 290px;
    height: 290px;
    top: 22px;
    pointer-events: none;
    transform-style: preserve-3d;
}

.orbit-1 {
    transform: rotateX(74deg) rotateY(-14deg);
}

.orbit-2 {
    width: 260px;
    height: 260px;
    top: 38px;
    transform: rotateX(76deg) rotateY(16deg);
}

.orbit-ring {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    border: 1.5px solid rgba(255, 218, 102, 0.26);
    position: relative;
    animation: spinSlow 9s linear infinite;
}

.orbit-2 .orbit-ring {
    border-color: rgba(255, 180, 60, 0.18);
    animation: spinSlowReverse 13s linear infinite;
}

.orbit-ring::after {
    content: "";
    position: absolute;
    top: -4px;
    left: 50%;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #fff4b8;
    box-shadow: 0 0 12px 3px rgba(255, 215, 90, 0.9);
}

.orbit-2 .orbit-ring::after {
    width: 5px;
    height: 5px;
    top: auto;
    bottom: -3px;
    background: #ffd147;
}

/* Anel guia sutil de toque */
.tap-guide {
    position: absolute;
    top: 42%;
    left: 50%;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    border: 2px solid rgba(255, 232, 148, 0.75);
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 6;
    animation: tapPulse 2.8s ease-out infinite;
}

.tap-guide.hidden {
    display: none;
}

.gift-button {
    position: relative;
    z-index: 4;
    border: 0;
    background: none;
    cursor: pointer;
    padding: 4px 16px 8px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    transform-style: preserve-3d;
}

.gift-button:focus-visible {
    outline: 2px solid var(--gold-300);
    outline-offset: 6px;
}

.tilt-layer {
    transform-style: preserve-3d;
    transition: transform 0.16s ease-out;
    will-change: transform;
}

.gift-wrapper {
    position: relative;
    width: 260px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gift-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: floatGift 3.2s ease-in-out infinite;
    filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.68));
    transition: filter 0.35s ease;
}

.gift-button:hover .gift-svg {
    filter:
        drop-shadow(0 26px 32px rgba(0, 0, 0, 0.75))
        drop-shadow(0 0 34px rgba(255, 204, 64, 0.45));
}

.floor-shadow {
    width: 176px;
    height: 24px;
    margin-top: -16px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.84) 0%, rgba(0, 0, 0, 0.25) 56%, transparent 76%);
    animation: shadowSync 3.2s ease-in-out infinite;
    pointer-events: none;
}

/* Partes internas do SVG 3D */
.gift-lid-group {
    transform-origin: 160px 115px;
    transition: transform 0.68s cubic-bezier(0.16, 1.25, 0.32, 1), opacity 0.45s ease;
}

.gift-box-group {
    transform-origin: 160px 268px;
    transition: transform 0.26s cubic-bezier(0.22, 1, 0.36, 1);
}

.metal-sheen {
    animation: metalSweep 4.2s ease-in-out infinite;
}

.seam-glow {
    opacity: 0.24;
    transition: opacity 0.25s ease;
    animation: seamBreath 3.2s ease-in-out infinite;
}

.vip-tag-group {
    transform-origin: 172px 96px;
    animation: tagSway 3.4s ease-in-out infinite;
}

.inner-beam {
    opacity: 0;
    transform-origin: 160px 135px;
    transform: scaleY(0.15);
    transition: opacity 0.3s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}

.gift-svg.rattle {
    animation: rattleBox 0.65s ease-in-out;
}

.gift-svg.charging {
    animation: none;
    filter:
        drop-shadow(0 0 38px rgba(255, 216, 92, 0.8))
        drop-shadow(0 18px 26px rgba(0, 0, 0, 0.78));
}

.gift-svg.charging .gift-box-group,
.gift-svg.charging .gift-lid-group {
    transform: translateY(8px) scale(1.045, 0.92);
}

.gift-svg.charging .seam-glow {
    opacity: 1;
}

.gift-svg.opening {
    animation: none;
    filter:
        drop-shadow(0 0 52px rgba(255, 224, 118, 0.96))
        drop-shadow(0 22px 34px rgba(0, 0, 0, 0.75));
}

.gift-svg.opening .gift-box-group {
    transform: scale(1.02, 0.98);
}

.gift-svg.opening .gift-lid-group {
    transform: translate(-24px, -94px) rotate(-21deg) scale(1.04);
    opacity: 0.92;
}

.gift-svg.opening .inner-beam {
    opacity: 1;
    transform: scaleY(1.28);
}

.gift-svg.opening .seam-glow {
    opacity: 0;
}

/* Botão CTA de alta conversão */
.cta-pill {
    position: relative;
    overflow: hidden;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    padding: 14px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, #fff0a8 0%, #ffbe26 50%, #db8604 100%);
    color: #211100;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    box-shadow:
        0 10px 28px rgba(255, 184, 30, 0.44),
        0 0 0 1px rgba(255, 236, 158, 0.45),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.85);
    animation: ctaPulse 2.4s ease-in-out infinite;
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.cta-arrow {
    display: inline-block;
    transition: transform 0.25s ease;
    font-size: 16px;
    line-height: 1;
}

.gift-button:hover .cta-pill {
    transform: translateY(-2px) scale(1.02);
    box-shadow:
        0 14px 36px rgba(255, 198, 56, 0.68),
        0 0 0 1px rgba(255, 240, 178, 0.7),
        inset 0 1.5px 1.5px rgba(255, 255, 255, 0.95);
}

.gift-button:hover .cta-arrow {
    transform: translateX(4px);
}

.gift-button:active .cta-pill {
    transform: scale(0.96);
}

.cta-pill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    transform: skewX(-22deg);
    animation: ctaShine 2.9s ease-in-out infinite;
}

/* Aviso flutuante de desbloqueio + fallback link */
.unlock-toast {
    position: absolute;
    bottom: 56px;
    left: 50%;
    transform: translate(-50%, 10px) scale(0.92);
    padding: 9px 18px;
    border-radius: 999px;
    background: rgba(20, 13, 3, 0.92);
    border: 1px solid rgba(255, 216, 92, 0.65);
    color: #ffec9e;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.4px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.55), 0 0 22px rgba(255, 200, 60, 0.28);
    transition: opacity 0.28s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 15;
}

.unlock-toast.visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
    pointer-events: auto;
}

.unlock-toast a {
    color: #fff;
    text-decoration: underline;
    margin-left: 4px;
}

/* Cartão inferior clicável */
.hint-button {
    width: 100%;
    margin-top: 6px;
    padding: 13px 16px;
    border: 1px solid rgba(255, 211, 77, 0.22);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
    backdrop-filter: blur(12px);
    border-radius: 15px;
    color: #c2b9ab;
    font-size: 13px;
    line-height: 1.45;
    font-family: inherit;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
    transition: border-color 0.25s ease, background 0.25s ease, transform 0.2s ease;
}

.hint-button:hover {
    border-color: rgba(255, 211, 77, 0.45);
    background: linear-gradient(180deg, rgba(255, 215, 90, 0.09), rgba(255, 255, 255, 0.03));
    transform: translateY(-1px);
}

.hint-button span {
    color: var(--gold-300);
    font-weight: 700;
}

/* Animações */
@keyframes floatGift {
    0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
    50% { transform: translateY(-13px) rotate(1deg); }
}

@keyframes shadowSync {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(0.81); opacity: 0.42; }
}

@keyframes rattleBox {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    15% { transform: translateY(-5px) rotate(-4.5deg) scale(1.02, 0.98); }
    30% { transform: translateY(-8px) rotate(4.5deg) scale(0.99, 1.02); }
    45% { transform: translateY(-4px) rotate(-3.5deg) scale(1.01, 0.99); }
    60% { transform: translateY(-2px) rotate(2.5deg); }
    75% { transform: translateY(0) rotate(-1.5deg); }
}

@keyframes metalSweep {
    0%, 55% { transform: translateX(-230px); }
    100% { transform: translateX(250px); }
}

@keyframes tapPulse {
    0% { transform: translate(-50%, -50%) scale(0.45); opacity: 0; }
    20% { opacity: 0.8; }
    70%, 100% { transform: translate(-50%, -50%) scale(1.85); opacity: 0; }
}

@keyframes ctaPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.025); }
}

@keyframes seamBreath {
    0%, 100% { opacity: 0.2; }
    50% { opacity: 0.62; }
}

@keyframes tagSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(4.5deg); }
}

@keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes spinSlowReverse {
    from { transform: rotate(360deg); }
    to { transform: rotate(0deg); }
}

@keyframes glowPulse {
    0%, 100% { transform: scale(0.95); opacity: 0.75; }
    50% { transform: scale(1.12); opacity: 1; }
}

@keyframes dotPulse {
    0%, 100% { transform: scale(0.9); opacity: 0.75; }
    50% { transform: scale(1.35); opacity: 1; }
}

@keyframes ctaShine {
    0%, 52% { left: -120%; }
    100% { left: 150%; }
}

/* Ajuste fino para WebView do Instagram com barras em cima e embaixo */
@media (max-height: 700px) {
    .gift-stage { height: 288px; }
    .gift-wrapper { width: 218px; height: 210px; }
    .orbit-plane { transform: scale(0.82) rotateX(74deg); }
    .live-badge { margin-bottom: 8px; }
    .cta-pill { padding: 12px 26px; font-size: 13px; }
}

@media (prefers-reduced-motion: reduce) {
    .gift-svg, .floor-shadow, .aura-rays, .aura-glow, .cta-pill, .cta-pill::after,
    .vip-tag-group, .seam-glow, .live-dot, .orbit-ring, .metal-sheen, .tap-guide {
        animation: none;
    }
}
</style>
</head>

<body>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div class="screen-flash" id="screenFlash" aria-hidden="true"></div>

<main class="container">
    <div class="live-badge">
        <span class="live-dot" aria-hidden="true"></span>
        <span>Reservado para você •</span>
        <span class="timer-pill" id="countdownTimer">02:59</span>
    </div>

    <h1>Tem um <span>presente</span> para você!</h1>

    <p class="subtitle">
        Preparamos uma surpresa exclusiva.
        Toque na caixa dourada antes que o tempo acabe!
    </p>

    <div class="gift-stage" id="giftStage">
        <div class="aura-rays" aria-hidden="true"></div>
        <div class="aura-glow" aria-hidden="true"></div>

        <!-- Anéis Orbitais 3D -->
        <div class="orbit-plane orbit-1" aria-hidden="true">
            <div class="orbit-ring"></div>
        </div>
        <div class="orbit-plane orbit-2" aria-hidden="true">
            <div class="orbit-ring"></div>
        </div>

        <!-- Guia sutil de toque -->
        <div class="tap-guide" id="tapGuide" aria-hidden="true"></div>

        <button
            type="button"
            class="gift-button"
            id="giftButton"
            aria-label="Abrir meu presente especial"
        >
            <div class="tilt-layer" id="tiltLayer">
                <div class="gift-wrapper">
                    <svg
                        class="gift-svg"
                        id="giftSvg"
                        viewBox="0 0 320 300"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <defs>
                            <linearGradient id="boxLeftGold" x1="68" y1="128" x2="160" y2="274" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFE998"/>
                                <stop offset="45%" stop-color="#E8AD28"/>
                                <stop offset="100%" stop-color="#9A6106"/>
                            </linearGradient>

                            <linearGradient id="boxRightGold" x1="160" y1="170" x2="252" y2="232" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#C98A16"/>
                                <stop offset="55%" stop-color="#9A6008"/>
                                <stop offset="100%" stop-color="#6B3F02"/>
                            </linearGradient>

                            <linearGradient id="sheenGrad" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"/>
                                <stop offset="50%" stop-color="#FFFDF0" stop-opacity="0.34"/>
                                <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
                            </linearGradient>

                            <clipPath id="boxBodyClip">
                                <polygon points="68,128 160,170 252,128 252,232 160,274 68,232"/>
                            </clipPath>

                            <linearGradient id="lidTopGold" x1="60" y1="98" x2="260" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFF3B3"/>
                                <stop offset="45%" stop-color="#F8CA4A"/>
                                <stop offset="100%" stop-color="#C98712"/>
                            </linearGradient>

                            <linearGradient id="lidLeftGold" x1="60" y1="98" x2="160" y2="178" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFEA9B"/>
                                <stop offset="100%" stop-color="#C88712"/>
                            </linearGradient>

                            <linearGradient id="lidRightGold" x1="160" y1="144" x2="260" y2="132" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#B8790E"/>
                                <stop offset="100%" stop-color="#704202"/>
                            </linearGradient>

                            <linearGradient id="ribbonLight" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#FF4742"/>
                                <stop offset="50%" stop-color="#D11018"/>
                                <stop offset="100%" stop-color="#8A040A"/>
                            </linearGradient>

                            <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#B80B12"/>
                                <stop offset="100%" stop-color="#580003"/>
                            </linearGradient>

                            <linearGradient id="ribbonTop" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#FF5C54"/>
                                <stop offset="50%" stop-color="#DF1620"/>
                                <stop offset="100%" stop-color="#9A060D"/>
                            </linearGradient>

                            <linearGradient id="bowOuterLeft" x1="80" y1="62" x2="155" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF6B62"/>
                                <stop offset="45%" stop-color="#DC141E"/>
                                <stop offset="100%" stop-color="#7D0308"/>
                            </linearGradient>

                            <linearGradient id="bowOuterRight" x1="240" y1="62" x2="165" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#F22929"/>
                                <stop offset="55%" stop-color="#B50A12"/>
                                <stop offset="100%" stop-color="#5C0004"/>
                            </linearGradient>

                            <linearGradient id="bowUpperLeft" x1="108" y1="45" x2="154" y2="92" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF5952"/>
                                <stop offset="60%" stop-color="#C90E17"/>
                                <stop offset="100%" stop-color="#6B0105"/>
                            </linearGradient>

                            <linearGradient id="bowUpperRight" x1="212" y1="45" x2="166" y2="92" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#E62222"/>
                                <stop offset="60%" stop-color="#A8070F"/>
                                <stop offset="100%" stop-color="#540003"/>
                            </linearGradient>

                            <linearGradient id="bowInsideDark" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#290001"/>
                                <stop offset="100%" stop-color="#6E0206"/>
                            </linearGradient>

                            <linearGradient id="knotGrad" x1="146" y1="76" x2="174" y2="104" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF6F66"/>
                                <stop offset="50%" stop-color="#D41019"/>

<script>
const DESTINO = "https://telehotchannel.site/canais";

const giftStage = document.getElementById("giftStage");
const giftButton = document.getElementById("giftButton");
const hintButton = document.getElementById("hintButton");
const tiltLayer = document.getElementById("tiltLayer");
const giftSvg = document.getElementById("giftSvg");
const tapGuide = document.getElementById("tapGuide");
const screenFlash = document.getElementById("screenFlash");
const unlockToast = document.getElementById("unlockToast");
const countdownTimer = document.getElementById("countdownTimer");
const canvas = document.getElementById("fx-canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let abrindo = false;
let fallbackTimer = null;

window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

/* --- 1. Contador regressivo de reserva VIP --- */
let timeLeft = 179; // 02:59
const timerInterval = setInterval(() => {
    if (timeLeft > 0) {
        timeLeft--;
        const mins = String(Math.floor(timeLeft / 60)).padStart(2, "0");
        const secs = String(timeLeft % 60).padStart(2, "0");
        countdownTimer.textContent = `${mins}:${secs}`;
    } else {
        countdownTimer.textContent = "Últimos segundos!";
        clearInterval(timerInterval);
    }
}, 1000);

/* --- 2. Efeito Sonoro Procedural (Sub-bass + Pop + Acorde Mágico) --- */
function playUnlockSound() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ac = new AudioCtx();
        const now = ac.currentTime;

        const subOsc = ac.createOscillator();
        const subGain = ac.createGain();
        subOsc.type = "sine";
        subOsc.frequency.setValueAtTime(110, now + 0.14);
        subOsc.frequency.exponentialRampToValueAtTime(38, now + 0.38);
        subGain.gain.setValueAtTime(0.001, now + 0.14);
        subGain.gain.linearRampToValueAtTime(0.28, now + 0.16);
        subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
        subOsc.connect(subGain);
        subGain.connect(ac.destination);
        subOsc.start(now + 0.14);
        subOsc.stop(now + 0.44);

        const popOsc = ac.createOscillator();
        const popGain = ac.createGain();
        popOsc.type = "triangle";
        popOsc.frequency.setValueAtTime(170, now + 0.14);
        popOsc.frequency.exponentialRampToValueAtTime(560, now + 0.25);
        popGain.gain.setValueAtTime(0.001, now + 0.14);
        popGain.gain.exponentialRampToValueAtTime(0.2, now + 0.17);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        popOsc.connect(popGain);
        popGain.connect(ac.destination);
        popOsc.start(now + 0.14);
        popOsc.stop(now + 0.34);

        const notes = [523.25, 659.25, 783.99, 987.77, 1174.66, 1567.98];
        notes.forEach((freq, idx) => {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            const start = now + 0.17 + idx * 0.04;
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.linearRampToValueAtTime(0.08, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.78);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(start);
            osc.stop(start + 0.82);
        });
    } catch (e) {}
}

/* --- 3. Parallax 3D + Rastro de Faíscas --- */
const ambientParticles = Array.from({ length: 42 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 2.3 + 0.7,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -(Math.random() * 0.5 + 0.15),
    alpha: Math.random() * 0.55 + 0.2,
    pulse: Math.random() * Math.PI * 2
}));

const burstParticles = [];
const shockwaves = [];
const burstColors = ["#FFF9D6", "#FFD34D", "#FFB41F", "#FF4A4A", "#FFFFFF", "#FFE380"];
let lastTrail = 0;

function spawnTrailSpark(x, y) {
    const now = performance.now();
    if (now - lastTrail < 28 || abrindo) return;
    lastTrail = now;
    burstParticles.push({
        x: x + (Math.random() - 0.5) * 8,
        y: y + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 1.1,
        vy: -(Math.random() * 1.2 + 0.3),
        size: Math.random() * 3 + 1.8,
        color: "#FFE88A",
        alpha: 0.75,
        rotation: Math.random() * Math.PI,
        vRot: (Math.random() - 0.5) * 0.12,
        gravity: 0.015,
        isStar: true
    });
}

function applyTilt(clientX, clientY) {
    if (abrindo) return;
    const rect = giftStage.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width - 0.5;
    const y = (clientY - rect.top) / rect.height - 0.5;
    const rotateY = Math.max(-15, Math.min(15, x * 26));
    const rotateX = Math.max(-11, Math.min(11, -y * 20));
    tiltLayer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    spawnTrailSpark(clientX, clientY);
}

window.addEventListener("mousemove", (e) => applyTilt(e.clientX, e.clientY));
window.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches[0]) {
        applyTilt(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

document.addEventListener("mouseleave", () => {
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";
});

function spawnLeakSparks() {
    const rect = giftSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.48;
    for (let i = 0; i < 9; i++) {
        burstParticles.push({
            x: cx + (Math.random() - 0.5) * 90,
            y: cy + (Math.random() - 0.5) * 16,
            vx: (Math.random() - 0.5) * 2.4,
            vy: -(Math.random() * 2.6 + 1.2),
            size: Math.random() * 3.6 + 2,
            color: "#FFE88A",
            alpha: 0.92,
            rotation: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 0.15,
            gravity: 0.03,
            isStar: true
        });
    }
}

function spawnBurst(originX, originY) {
    shockwaves.push({ x: originX, y: originY, r: 16, maxR: 280, alpha: 0.9, lineWidth: 5 });
    shockwaves.push({ x: originX, y: originY, r: 6, maxR: 195, alpha: 0.68, lineWidth: 3 });

    for (let i = 0; i < 105; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 11 + 3.4;
        burstParticles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 4.2,
            size: Math.random() * 7 + 3,
            color: burstColors[Math.floor(Math.random() * burstColors.length)],
            alpha: 1,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.28,
            gravity: 0.2,
            isStar: i % 3 === 0
        });
    }
}

function drawStar(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        ctx.lineTo(0, -r);
        ctx.rotate(Math.PI / 4);
        ctx.lineTo(0, -r * 0.35);
        ctx.rotate(Math.PI / 4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function animateFX() {
    ctx.clearRect(0, 0, width, height);

    for (const p of ambientParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.03;

        if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
        }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        const currentAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 220, 110, ${currentAlpha})`;
        ctx.fill();
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += (s.maxR - s.r) * 0.14;
        s.alpha -= 0.024;
        if (s.alpha <= 0) {
            shockwaves.splice(i, 1);
            continue;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 224, 120, ${s.alpha})`;
        ctx.lineWidth = s.lineWidth;
        ctx.stroke();
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += b.gravity;
        b.vx *= 0.985;
        b.rotation += b.vRot;
        b.alpha -= 0.014;

        if (b.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = b.color;
        if (b.isStar) {
            drawStar(b.x, b.y, b.size * 0.85, b.rotation);
        } else {
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rotation);
            ctx.fillRect(-b.size / 2, -b.size / 3, b.size, b.size * 0.62);
        }
        ctx.restore();
    }

    requestAnimationFrame(animateFX);
}

animateFX();

/* --- 4. Animação periódica de expectativa --- */
setInterval(() => {
    if (abrindo) return;
    giftSvg.classList.remove("rattle");
    void giftSvg.offsetWidth;
    giftSvg.classList.add("rattle");
    spawnLeakSparks();
    setTimeout(() => {
        giftSvg.classList.remove("rattle");
    }, 680);
}, 3600);

/* --- 5. Sequência de Abertura e Redirecionamento --- */
function abrirPresente() {
    if (abrindo) return;
    abrindo = true;
    giftButton.disabled = true;
    hintButton.disabled = true;
    tapGuide.classList.add("hidden");
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";

    if (navigator.vibrate) {
        try { navigator.vibrate([25, 30, 65]); } catch (e) {}
    }

    playUnlockSound();

    giftSvg.classList.remove("rattle");
    giftSvg.classList.add("charging");

    setTimeout(() => {
        giftSvg.classList.remove("charging");
        giftSvg.classList.add("opening");

        const rect = giftSvg.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height * 0.42;
        spawnBurst(centerX, centerY);

        unlockToast.textContent = "✨ Presente desbloqueado! Abrindo...";
        unlockToast.classList.add("visible");
    }, 150);

    setTimeout(() => {
        screenFlash.classList.add("active");
    }, 620);

    setTimeout(() => {
        window.location.assign(DESTINO);
    }, 920);

    fallbackTimer = setTimeout(() => {
        screenFlash.classList.remove("active");
        unlockToast.innerHTML = `✨ Liberado! <a href="${DESTINO}">Toque aqui se não abrir</a>`;
    }, 2200);
}

giftButton.addEventListener("click", abrirPresente);
hintButton.addEventListener("click", abrirPresente);

/* Restaura o estado caso o usuário volte pelo botão do navegador */
window.addEventListener("pageshow", () => {
    clearTimeout(fallbackTimer);
    abrindo = false;
    giftButton.disabled = false;
    hintButton.disabled = false;
    tapGuide.classList.remove("hidden");
    giftSvg.classList.remove("opening", "charging", "rattle");
    screenFlash.classList.remove("active");
    unlockToast.classList.remove("visible");
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>
