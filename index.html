<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070605">
<title>Presente Especial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold-100: #fff7cf;
    --gold-300: #ffd85c;
    --gold-500: #e5a922;
    --gold-700: #8f5c06;
    --bg-dark: #070605;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 42%, #422909 0%, #170e04 46%, #050403 88%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
    user-select: none;
}

/* Textura sutil de vinheta cinematográfica */
body::after {
    content: "";
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at center, transparent 52%, rgba(0, 0, 0, 0.72) 100%);
    pointer-events: none;
    z-index: 2;
}

#fx-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 3;
}

.screen-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 48%, #ffffff, #fff1aa 32%, #ffb829 65%, transparent 90%);
    opacity: 0;
    pointer-events: none;
    z-index: 30;
    transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1);
}

.screen-flash.active {
    opacity: 0.92;
}

.container {
    width: 100%;
    max-width: 470px;
    padding: 20px 20px 24px;
    text-align: center;
    position: relative;
    z-index: 10;
}

/* Pílula de status ao vivo */
.live-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 15px;
    margin-bottom: 14px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-100);
    background: rgba(255, 211, 77, 0.08);
    border: 1px solid rgba(255, 211, 77, 0.28);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.35);
}

.live-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #ffd85c;
    box-shadow: 0 0 10px #ffd85c;
    animation: dotPulse 1.6s ease-in-out infinite;
}

h1 {
    font-size: clamp(26px, 6.2vw, 34px);
    font-weight: 850;
    line-height: 1.16;
    margin-bottom: 10px;
    letter-spacing: -0.5px;
}

h1 span {
    background: linear-gradient(135deg, #fff8cc 0%, #ffd34d 45%, #e39512 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 20px rgba(255, 196, 46, 0.35));
}

.subtitle {
    color: #bfb7aa;
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 340px;
    margin: 0 auto;
}

/* Palco 3D interativo */
.gift-stage {
    position: relative;
    height: 350px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 2px 0 8px;
    perspective: 950px;
}

.aura-rays {
    position: absolute;
    width: 370px;
    height: 370px;
    border-radius: 50%;
    background: conic-gradient(
        from 0deg,
        transparent 0deg 18deg,
        rgba(255, 206, 72, 0.14) 28deg,
        transparent 44deg 74deg,
        rgba(255, 206, 72, 0.09) 90deg,
        transparent 110deg 145deg,
        rgba(255, 206, 72, 0.14) 160deg,
        transparent 180deg 215deg,
        rgba(255, 206, 72, 0.11) 235deg,
        transparent 255deg 290deg,
        rgba(255, 206, 72, 0.13) 310deg,
        transparent 335deg 360deg
    );
    -webkit-mask-image: radial-gradient(circle, black 16%, transparent 66%);
    mask-image: radial-gradient(circle, black 16%, transparent 66%);
    animation: spinSlow 20s linear infinite;
    pointer-events: none;
    transition: transform 0.6s ease, opacity 0.4s ease;
}

.aura-glow {
    position: absolute;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 196, 46, 0.3) 0%, rgba(255, 140, 0, 0.09) 46%, transparent 74%);
    filter: blur(22px);
    pointer-events: none;
    animation: glowPulse 3s ease-in-out infinite;
    transition: transform 0.5s ease, opacity 0.4s ease;
}

.gift-button {
    position: relative;
    z-index: 4;
    border: 0;
    background: none;
    cursor: pointer;
    padding: 4px 16px 10px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    transform-style: preserve-3d;
    transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
}

.gift-button:focus-visible {
    outline: 2px solid var(--gold-300);
    outline-offset: 6px;
}

.tilt-layer {
    transform-style: preserve-3d;
    transition: transform 0.18s ease-out;
    will-change: transform;
}

.gift-wrapper {
    position: relative;
    width: 260px;
    height: 250px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gift-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: floatGift 3.2s ease-in-out infinite;
    filter: drop-shadow(0 22px 26px rgba(0, 0, 0, 0.68));
    transition: filter 0.35s ease;
}

.gift-button:hover .gift-svg {
    filter:
        drop-shadow(0 26px 32px rgba(0, 0, 0, 0.72))
        drop-shadow(0 0 32px rgba(255, 204, 64, 0.4));
}

.floor-shadow {
    width: 174px;
    height: 24px;
    margin-top: -16px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.82) 0%, rgba(0, 0, 0, 0.25) 56%, transparent 76%);
    animation: shadowSync 3.2s ease-in-out infinite;
    pointer-events: none;
}

/* Partes internas do SVG 3D */
.gift-lid-group {
    transform-origin: 160px 115px;
    transition: transform 0.7s cubic-bezier(0.16, 1.25, 0.32, 1), opacity 0.45s ease;
}

.gift-box-group {
    transform-origin: 160px 268px;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

.seam-glow {
    opacity: 0.22;
    transition: opacity 0.25s ease;
    animation: seamBreath 3.2s ease-in-out infinite;
}

.vip-tag-group {
    transform-origin: 172px 96px;
    animation: tagSway 3.4s ease-in-out infinite;
}

.inner-beam {
    opacity: 0;
    transform-origin: 160px 135px;
    transform: scaleY(0.15);
    transition: opacity 0.32s ease, transform 0.55s cubic-bezier(0.22, 1, 0.36, 1);
}

/* Animação periódica de "algo se mexendo lá dentro" */
.gift-svg.rattle {
    animation: rattleBox 0.65s ease-in-out;
}

/* Etapa 1 do clique: compressão rápida de energia */
.gift-svg.charging {
    animation: none;
    filter:
        drop-shadow(0 0 34px rgba(255, 216, 92, 0.75))
        drop-shadow(0 18px 26px rgba(0, 0, 0, 0.75));
}

.gift-svg.charging .gift-box-group,
.gift-svg.charging .gift-lid-group {
    transform: translateY(7px) scale(1.04, 0.93);
}

.gift-svg.charging .seam-glow {
    opacity: 1;
}

/* Etapa 2 do clique: explosão e abertura */
.gift-svg.opening {
    animation: none;
    filter:
        drop-shadow(0 0 48px rgba(255, 224, 118, 0.95))
        drop-shadow(0 22px 34px rgba(0, 0, 0, 0.75));
}

.gift-svg.opening .gift-box-group {
    transform: scale(1.02, 0.98);
}

.gift-svg.opening .gift-lid-group {
    transform: translate(-22px, -90px) rotate(-20deg) scale(1.04);
    opacity: 0.92;
}

.gift-svg.opening .inner-beam {
    opacity: 1;
    transform: scaleY(1.25);
}

.gift-svg.opening .seam-glow {
    opacity: 0;
}

/* Botão CTA */
.cta-pill {
    position: relative;
    overflow: hidden;
    margin-top: 10px;
    padding: 13px 32px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffec99 0%, #ffb923 50%, #dd8906 100%);
    color: #241300;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    box-shadow:
        0 10px 26px rgba(255, 184, 30, 0.4),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.8);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
}

.gift-button:hover .cta-pill {
    transform: translateY(-2px);
    box-shadow:
        0 14px 34px rgba(255, 198, 56, 0.65),
        inset 0 1px 1.5px rgba(255, 255, 255, 0.92);
}

.gift-button:active .cta-pill {
    transform: scale(0.96);
}

.cta-pill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.72), transparent);
    transform: skewX(-22deg);
    animation: ctaShine 3s ease-in-out infinite;
}

/* Mensagem de desbloqueio ao abrir */
.unlock-toast {
    position: absolute;
    bottom: 52px;
    left: 50%;
    transform: translate(-50%, 10px) scale(0.92);
    padding: 8px 18px;
    border-radius: 999px;
    background: rgba(24, 16, 4, 0.88);
    border: 1px solid rgba(255, 216, 92, 0.6);
    color: #ffe997;
    font-size: 12.5px;
    font-weight: 700;
    letter-spacing: 0.6px;
    white-space: nowrap;
    opacity: 0;
    pointer-events: none;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 200, 60, 0.25);
    transition: opacity 0.3s ease, transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    z-index: 12;
}

.unlock-toast.visible {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
}

.hint {
    margin-top: 6px;
    padding: 14px 18px;
    border: 1px solid rgba(255, 211, 77, 0.2);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.02));
    backdrop-filter: blur(12px);
    border-radius: 15px;
    color: #b7b0a4;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.38);
}

.hint span {
    color: var(--gold-300);
    font-weight: 700;
}

/* Animações */
@keyframes floatGift {
    0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
    50% { transform: translateY(-13px) rotate(1deg); }
}

@keyframes shadowSync {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(0.81); opacity: 0.42; }
}

@keyframes rattleBox {
    0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
    15% { transform: translateY(-5px) rotate(-4deg) scale(1.02, 0.98); }
    30% { transform: translateY(-7px) rotate(4deg) scale(0.99, 1.02); }
    45% { transform: translateY(-4px) rotate(-3deg) scale(1.01, 0.99); }
    60% { transform: translateY(-2px) rotate(2.5deg); }
    75% { transform: translateY(0) rotate(-1.5deg); }
}

@keyframes seamBreath {
    0%, 100% { opacity: 0.18; }
    50% { opacity: 0.55; }
}

@keyframes tagSway {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(4deg); }
}

@keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes glowPulse {
    0%, 100% { transform: scale(0.95); opacity: 0.75; }
    50% { transform: scale(1.12); opacity: 1; }
}

@keyframes dotPulse {
    0%, 100% { transform: scale(0.9); opacity: 0.7; }
    50% { transform: scale(1.3); opacity: 1; }
}

@keyframes ctaShine {
    0%, 55% { left: -120%; }
    100% { left: 150%; }
}

@media (max-height: 670px) {
    .gift-stage { height: 300px; }
    .gift-wrapper { width: 225px; height: 215px; }
    .live-badge { margin-bottom: 8px; }
}

@media (prefers-reduced-motion: reduce) {
    .gift-svg, .floor-shadow, .aura-rays, .aura-glow, .cta-pill::after, .vip-tag-group, .seam-glow, .live-dot {
        animation: none;
    }
}
</style>
</head>

<body>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div class="screen-flash" id="screenFlash" aria-hidden="true"></div>

<main class="container">
    <div class="live-badge">
        <span class="live-dot" aria-hidden="true"></span>
        Acesso Exclusivo Liberado
    </div>

    <h1>Tem um <span>presente</span> para você!</h1>

    <p class="subtitle">
        Preparamos uma surpresa especial.
        Toque na caixa dourada para abrir agora!
    </p>

    <div class="gift-stage" id="giftStage">
        <div class="aura-rays" aria-hidden="true"></div>
        <div class="aura-glow" aria-hidden="true"></div>

        <button
            type="button"
            class="gift-button"
            id="giftButton"
            aria-label="Abrir presente especial"
        >
            <div class="tilt-layer" id="tiltLayer">
                <div class="gift-wrapper">
                    <svg
                        class="gift-svg"
                        id="giftSvg"
                        viewBox="0 0 320 300"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >
                        <defs>
                            <!-- Ouro da face esquerda (iluminada) -->
                            <linearGradient id="boxLeftGold" x1="68" y1="128" x2="160" y2="274" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFE894"/>
                                <stop offset="45%" stop-color="#E8AD28"/>
                                <stop offset="100%" stop-color="#9A6106"/>
                            </linearGradient>

                            <!-- Ouro da face direita (sombreada) -->
                            <linearGradient id="boxRightGold" x1="160" y1="170" x2="252" y2="232" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#C98A16"/>
                                <stop offset="55%" stop-color="#9A6008"/>
                                <stop offset="100%" stop-color="#6B3F02"/>
                            </linearGradient>

                            <!-- Ouro da tampa -->
                            <linearGradient id="lidTopGold" x1="60" y1="98" x2="260" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFF3B3"/>
                                <stop offset="45%" stop-color="#F8CA4A"/>
                                <stop offset="100%" stop-color="#C98712"/>
                            </linearGradient>

                            <linearGradient id="lidLeftGold" x1="60" y1="98" x2="160" y2="178" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFEA9B"/>
                                <stop offset="100%" stop-color="#C88712"/>
                            </linearGradient>

                            <linearGradient id="lidRightGold" x1="160" y1="144" x2="260" y2="132" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#B8790E"/>
                                <stop offset="100%" stop-color="#704202"/>
                            </linearGradient>

                            <!-- Fita vermelha cetim -->
                            <linearGradient id="ribbonLight" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#FF4742"/>
                                <stop offset="50%" stop-color="#D11018"/>
                                <stop offset="100%" stop-color="#8A040A"/>
                            </linearGradient>

                            <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
                                <stop offset="0%" stop-color="#B80B12"/>
                                <stop offset="100%" stop-color="#580003"/>
                            </linearGradient>

                            <linearGradient id="ribbonTop" x1="0" y1="0" x2="1" y2="0">
                                <stop offset="0%" stop-color="#FF5C54"/>
                                <stop offset="50%" stop-color="#DF1620"/>
                                <stop offset="100%" stop-color="#9A060D"/>
                            </linearGradient>

                            <!-- Laço 3D -->
                            <linearGradient id="bowOuterLeft" x1="80" y1="62" x2="155" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF6B62"/>
                                <stop offset="45%" stop-color="#DC141E"/>
                                <stop offset="100%" stop-color="#7D0308"/>
                            </linearGradient>

                            <linearGradient id="bowOuterRight" x1="240" y1="62" x2="165" y2="98" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#F22929"/>
                                <stop offset="55%" stop-color="#B50A12"/>
                                <stop offset="100%" stop-color="#5C0004"/>
                            </linearGradient>

                            <linearGradient id="bowUpperLeft" x1="108" y1="45" x2="154" y2="92" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF5952"/>
                                <stop offset="60%" stop-color="#C90E17"/>
                                <stop offset="100%" stop-color="#6B0105"/>
                            </linearGradient>

                            <linearGradient id="bowUpperRight" x1="212" y1="45" x2="166" y2="92" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#E62222"/>
                                <stop offset="60%" stop-color="#A8070F"/>
                                <stop offset="100%" stop-color="#540003"/>
                            </linearGradient>

                            <linearGradient id="bowInsideDark" x1="0" y1="0" x2="0" y2="1">
                                <stop offset="0%" stop-color="#290001"/>
                                <stop offset="100%" stop-color="#6E0206"/>
                            </linearGradient>

                            <linearGradient id="knotGrad" x1="146" y1="76" x2="174" y2="104" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FF6F66"/>
                                <stop offset="50%" stop-color="#D41019"/>
                                <stop offset="100%" stop-color="#5E0004"/>
                            </linearGradient>

                            <linearGradient id="tailLeftGrad" x1="154" y1="98" x2="126" y2="168" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#C90E17"/>
                                <stop offset="55%" stop-color="#F53833"/>
                                <stop offset="100%" stop-color="#870409"/>
                            </linearGradient>

                            <linearGradient id="tailRightGrad" x1="166" y1="98" x2="192" y2="166" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#A8070E"/>
                                <stop offset="55%" stop-color="#D6141C"/>
                                <stop offset="100%" stop-color="#630004"/>
                            </linearGradient>

                            <radialGradient id="cavityGlow" cx="50%" cy="55%" r="55%">
                                <stop offset="0%" stop-color="#FFFBE0"/>
                                <stop offset="55%" stop-color="#FFD048"/>
                                <stop offset="100%" stop-color="#703B00"/>
                            </radialGradient>

                            <linearGradient id="beamGrad" x1="160" y1="140" x2="160" y2="-25" gradientUnits="userSpaceOnUse">
                                <stop offset="0%" stop-color="#FFFCE6" stop-opacity="0.98"/>
                                <stop offset="48%" stop-color="#FFD24C" stop-opacity="0.52"/>
                                <stop offset="100%" stop-color="#FFD24C" stop-opacity="0"/>
                            </linearGradient>

                            <filter id="glowLine" x="-20%" y="-20%" width="140%" height="140%">
                                <feGaussianBlur stdDeviation="3.5" result="blur"/>
                                <feMerge>
                                    <feMergeNode in="blur"/>
                                    <feMergeNode in="SourceGraphic"/>
                                </feMerge>
                            </filter>
                        </defs>

                        <!-- CORPO DA CAIXA 3D -->
                        <g class="gift-box-group">
                            <!-- Interior brilhante (revelado quando a tampa abre) -->
                            <polygon points="160,86 252,128 160,170 68,128" fill="#5E3500"/>
                            <polygon points="160,92 242,128 160,164 78,128" fill="url(#cavityGlow)"/>

                            <!-- Faces externas -->
                            <polygon points="68,128 160,170 160,274 68,232" fill="url(#boxLeftGold)"/>
                            <polygon points="160,170 252,128 252,232 160,274" fill="url(#boxRightGold)"/>

                            <!-- Brilho metálico na quina central -->
                            <line x1="160" y1="170" x2="160" y2="274" stroke="#FFF4BE" stroke-width="1.4" stroke-opacity="0.58"/>

                            <!-- Fitas verticais com bordas douradas -->
                            <polygon points="101,143 127,155 127,259 101,247" fill="url(#ribbonLight)"/>
                            <line x1="101" y1="143" x2="101" y2="247" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.78"/>
                            <line x1="127" y1="155" x2="127" y2="259" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.78"/>

                            <polygon points="193,155 219,143 219,247 193,259" fill="url(#ribbonDark)"/>
                            <line x1="193" y1="155" x2="193" y2="259" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.55"/>
                            <line x1="219" y1="143" x2="219" y2="247" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.55"/>

                            <!-- Sombra da tampa sobre o corpo -->
                            <polygon points="68,128 160,170 160,187 68,145" fill="#1C0A00" fill-opacity="0.48"/>
                            <polygon points="160,170 252,128 252,145 160,187" fill="#120600" fill-opacity="0.58"/>
                        </g>

                        <!-- FEIXE DE LUZ AO ABRIR -->
                        <g class="inner-beam">
                            <polygon points="82,130 238,130 302,-25 18,-25" fill="url(#beamGrad)"/>
                        </g>

                        <!-- TAMPA 3D + LAÇO + TAG VIP -->
                        <g class="gift-lid-group">
                            <!-- Luz mágica vazando pela fresta abaixo da tampa -->
                            <polyline
                                class="seam-glow"
                                points="61,132 160,178 259,132"
                                stroke="#FFE98A"
                                stroke-width="2.4"
                                stroke-linecap="round"
                                filter="url(#glowLine)"
                                fill="none"
                            />

                            <!-- Laterais e topo da tampa -->
                            <polygon points="60,98 160,144 160,178 60,132" fill="url(#lidLeftGold)"/>
                            <polygon points="160,144 260,98 260,132 160,178" fill="url(#lidRightGold)"/>
                            <polygon points="60,98 160,52 260,98 160,144" fill="url(#lidTopGold)"/>

                            <!-- Realce nas quinas da tampa -->
                            <polyline points="60,98 160,144 260,98" stroke="#FFF8D2" stroke-width="1.4" stroke-opacity="0.72" fill="none"/>
                            <line x1="160" y1="144" x2="160" y2="178" stroke="#FFF6C4" stroke-width="1.3" stroke-opacity="0.52"/>

                            <!-- Fitas na tampa -->

<script>
const DESTINO = "https://telehotchannel.site";

const giftStage = document.getElementById("giftStage");
const giftButton = document.getElementById("giftButton");
const tiltLayer = document.getElementById("tiltLayer");
const giftSvg = document.getElementById("giftSvg");
const screenFlash = document.getElementById("screenFlash");
const unlockToast = document.getElementById("unlockToast");
const canvas = document.getElementById("fx-canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let abrindo = false;

window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

/* --- 1. Efeito Sonoro Procedural (Web Audio API) --- */
function playUnlockSound() {
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ac = new AudioCtx();
        const now = ac.currentTime;

        // Pop suave na abertura da tampa
        const popOsc = ac.createOscillator();
        const popGain = ac.createGain();
        popOsc.type = "triangle";
        popOsc.frequency.setValueAtTime(160, now + 0.14);
        popOsc.frequency.exponentialRampToValueAtTime(520, now + 0.24);
        popGain.gain.setValueAtTime(0.001, now + 0.14);
        popGain.gain.exponentialRampToValueAtTime(0.22, now + 0.17);
        popGain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
        popOsc.connect(popGain);
        popGain.connect(ac.destination);
        popOsc.start(now + 0.14);
        popOsc.stop(now + 0.34);

        // Acorde mágico brilhante (Dó maior com 7ª e 9ª)
        const notes = [523.25, 659.25, 783.99, 987.77, 1174.66];
        notes.forEach((freq, idx) => {
            const osc = ac.createOscillator();
            const gain = ac.createGain();
            const start = now + 0.18 + idx * 0.045;
            osc.type = "sine";
            osc.frequency.setValueAtTime(freq, start);
            gain.gain.setValueAtTime(0.001, start);
            gain.gain.linearRampToValueAtTime(0.09, start + 0.03);
            gain.gain.exponentialRampToValueAtTime(0.0008, start + 0.75);
            osc.connect(gain);
            gain.connect(ac.destination);
            osc.start(start);
            osc.stop(start + 0.8);
        });
    } catch (e) {
        // Falha silenciosa se áudio não estiver disponível
    }
}

/* --- 2. Parallax 3D com Mouse / Toque --- */
function applyTilt(clientX, clientY) {
    if (abrindo) return;
    const rect = giftStage.getBoundingClientRect();
    const x = (clientX - rect.left) / rect.width - 0.5;
    const y = (clientY - rect.top) / rect.height - 0.5;
    const rotateY = Math.max(-14, Math.min(14, x * 24));
    const rotateX = Math.max(-10, Math.min(10, -y * 18));
    tiltLayer.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
}

window.addEventListener("mousemove", (e) => applyTilt(e.clientX, e.clientY));
window.addEventListener("touchmove", (e) => {
    if (e.touches && e.touches[0]) {
        applyTilt(e.touches[0].clientX, e.touches[0].clientY);
    }
}, { passive: true });

document.addEventListener("mouseleave", () => {
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";
});

/* --- 3. Partículas Canvas (Poeira + Faíscas + Confetes + Ondas) --- */
const ambientParticles = Array.from({ length: 42 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 2.3 + 0.7,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -(Math.random() * 0.5 + 0.15),
    alpha: Math.random() * 0.55 + 0.2,
    pulse: Math.random() * Math.PI * 2
}));

const burstParticles = [];
const shockwaves = [];
const burstColors = ["#FFF9D6", "#FFD34D", "#FFB41F", "#FF4A4A", "#FFFFFF", "#FFE380"];

function spawnLeakSparks() {
    const rect = giftSvg.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height * 0.48;
    for (let i = 0; i < 8; i++) {
        burstParticles.push({
            x: cx + (Math.random() - 0.5) * 90,
            y: cy + (Math.random() - 0.5) * 16,
            vx: (Math.random() - 0.5) * 2.2,
            vy: -(Math.random() * 2.5 + 1.2),
            size: Math.random() * 3.5 + 2,
            color: "#FFE88A",
            alpha: 0.9,
            rotation: Math.random() * Math.PI,
            vRot: (Math.random() - 0.5) * 0.15,
            gravity: 0.03,
            isStar: true
        });
    }
}

function spawnBurst(originX, originY) {
    shockwaves.push({ x: originX, y: originY, r: 16, maxR: 260, alpha: 0.85, lineWidth: 5 });
    shockwaves.push({ x: originX, y: originY, r: 6, maxR: 185, alpha: 0.65, lineWidth: 3 });

    for (let i = 0; i < 95; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 10.5 + 3.2;
        burstParticles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 4,
            size: Math.random() * 7 + 3,
            color: burstColors[Math.floor(Math.random() * burstColors.length)],
            alpha: 1,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.28,
            gravity: 0.2,
            isStar: i % 3 === 0
        });
    }
}

function drawStar(x, y, r, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 4; i++) {
        ctx.lineTo(0, -r);
        ctx.rotate(Math.PI / 4);
        ctx.lineTo(0, -r * 0.35);
        ctx.rotate(Math.PI / 4);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
}

function animateFX() {
    ctx.clearRect(0, 0, width, height);

    for (const p of ambientParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.03;

        if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
        }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        const currentAlpha = p.alpha * (0.6 + 0.4 * Math.sin(p.pulse));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 220, 110, ${currentAlpha})`;
        ctx.fill();
    }

    for (let i = shockwaves.length - 1; i >= 0; i--) {
        const s = shockwaves[i];
        s.r += (s.maxR - s.r) * 0.14;
        s.alpha -= 0.025;
        if (s.alpha <= 0) {
            shockwaves.splice(i, 1);
            continue;
        }
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 224, 120, ${s.alpha})`;
        ctx.lineWidth = s.lineWidth;
        ctx.stroke();
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += b.gravity;
        b.vx *= 0.985;
        b.rotation += b.vRot;
        b.alpha -= 0.014;

        if (b.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = b.color;
        if (b.isStar) {
            drawStar(b.x, b.y, b.size * 0.85, b.rotation);
        } else {
            ctx.translate(b.x, b.y);
            ctx.rotate(b.rotation);
            ctx.fillRect(-b.size / 2, -b.size / 3, b.size, b.size * 0.62);
        }
        ctx.restore();
    }

    requestAnimationFrame(animateFX);
}

animateFX();

/* --- 4. Animação periódica de expectativa (tremidinha + faíscas) --- */
setInterval(() => {
    if (abrindo) return;
    giftSvg.classList.remove("rattle");
    void giftSvg.offsetWidth;
    giftSvg.classList.add("rattle");
    spawnLeakSparks();
    setTimeout(() => {
        giftSvg.classList.remove("rattle");
    }, 680);
}, 3800);

/* --- 5. Sequência de Abertura e Redirecionamento --- */
giftButton.addEventListener("click", () => {
    if (abrindo) return;
    abrindo = true;
    giftButton.disabled = true;
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";

    playUnlockSound();

    // Fase 1: Compressão rápida acumulando energia
    giftSvg.classList.remove("rattle");
    giftSvg.classList.add("charging");

    // Fase 2: Explosão e abertura da tampa
    setTimeout(() => {
        giftSvg.classList.remove("charging");
        giftSvg.classList.add("opening");

        const rect = giftSvg.getBoundingClientRect();
        const centerX = rect.left + rect.width / 2;
        const centerY = rect.top + rect.height * 0.42;
        spawnBurst(centerX, centerY);
        unlockToast.classList.add("visible");
    }, 150);

    // Fase 3: Flash dourado e redirecionamento
    setTimeout(() => {
        screenFlash.classList.add("active");
    }, 640);

    setTimeout(() => {
        window.location.assign(DESTINO);
    }, 980);
});

/* Restaura o estado caso o usuário volte pelo botão do navegador */
window.addEventListener("pageshow", () => {
    abrindo = false;
    giftButton.disabled = false;
    giftSvg.classList.remove("opening", "charging", "rattle");
    screenFlash.classList.remove("active");
    unlockToast.classList.remove("visible");
    tiltLayer.style.transform = "rotateX(0deg) rotateY(0deg)";
});
</script>
