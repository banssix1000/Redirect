<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070605">
<title>Presente Especial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --gold-100: #fff6c9;
    --gold-300: #ffd85c;
    --gold-500: #e5a922;
    --bg-dark: #070605;
}

body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    justify-content: center;
    align-items: center;
    background:
        radial-gradient(circle at 50% 44%, #3c2508 0%, #160e05 46%, #060504 88%);
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #fff;
    overflow: hidden;
    position: relative;
}

#fx-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 1;
}

.screen-flash {
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 50% 48%, #fffbe0, #ffd24c 38%, transparent 74%);
    opacity: 0;
    pointer-events: none;
    z-index: 20;
    transition: opacity 0.42s ease;
}

.screen-flash.active {
    opacity: 0.78;
}

.container {
    width: 100%;
    max-width: 460px;
    padding: 22px 20px;
    text-align: center;
    position: relative;
    z-index: 5;
}

.badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 6px 14px;
    margin-bottom: 12px;
    border-radius: 999px;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.6px;
    text-transform: uppercase;
    color: var(--gold-300);
    background: rgba(255, 211, 77, 0.08);
    border: 1px solid rgba(255, 211, 77, 0.25);
    backdrop-filter: blur(8px);
}

h1 {
    font-size: clamp(25px, 6vw, 32px);
    font-weight: 800;
    line-height: 1.2;
    margin-bottom: 10px;
    letter-spacing: -0.4px;
}

h1 span {
    background: linear-gradient(135deg, #fff6c2 0%, #ffd34d 45%, #e29612 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255, 196, 46, 0.35));
}

.subtitle {
    color: #b7b0a4;
    font-size: 14.5px;
    line-height: 1.55;
    max-width: 330px;
    margin: 0 auto;
}

/* Palco 3D do presente */
.gift-stage {
    position: relative;
    height: 345px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    margin: 4px 0 8px;
}

.aura-rays {
    position: absolute;
    width: 350px;
    height: 350px;
    border-radius: 50%;
    background: conic-gradient(
        from 0deg,
        transparent 0deg 20deg,
        rgba(255, 206, 72, 0.12) 30deg,
        transparent 45deg 75deg,
        rgba(255, 206, 72, 0.09) 90deg,
        transparent 110deg 145deg,
        rgba(255, 206, 72, 0.13) 160deg,
        transparent 180deg 215deg,
        rgba(255, 206, 72, 0.10) 235deg,
        transparent 255deg 290deg,
        rgba(255, 206, 72, 0.12) 310deg,
        transparent 335deg 360deg
    );
    -webkit-mask-image: radial-gradient(circle, black 18%, transparent 66%);
    mask-image: radial-gradient(circle, black 18%, transparent 66%);
    animation: spinSlow 20s linear infinite;
    pointer-events: none;
}

.aura-glow {
    position: absolute;
    width: 245px;
    height: 245px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255, 196, 46, 0.28) 0%, rgba(255, 140, 0, 0.08) 46%, transparent 72%);
    filter: blur(20px);
    pointer-events: none;
    animation: glowPulse 3s ease-in-out infinite;
}

.gift-button {
    position: relative;
    z-index: 3;
    border: 0;
    background: none;
    cursor: pointer;
    padding: 4px 16px 10px;
    border-radius: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
}

.gift-button:hover {
    transform: translateY(-4px) scale(1.03);
}

.gift-button:active {
    transform: scale(0.96);
}

.gift-button:focus-visible {
    outline: 2px solid var(--gold-300);
    outline-offset: 6px;
}

.gift-wrapper {
    position: relative;
    width: 255px;
    height: 245px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gift-svg {
    width: 100%;
    height: 100%;
    overflow: visible;
    animation: floatGift 3s ease-in-out infinite;
    filter: drop-shadow(0 20px 26px rgba(0, 0, 0, 0.65));
    transition: filter 0.35s ease;
}

.gift-button:hover .gift-svg {
    filter:
        drop-shadow(0 24px 32px rgba(0, 0, 0, 0.72))
        drop-shadow(0 0 28px rgba(255, 200, 60, 0.36));
}

.floor-shadow {
    width: 170px;
    height: 24px;
    margin-top: -16px;
    border-radius: 50%;
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.8) 0%, rgba(0, 0, 0, 0.25) 55%, transparent 76%);
    animation: shadowSync 3s ease-in-out infinite;
    pointer-events: none;
}

/* Grupos animados do SVG 3D */
.gift-lid-group {
    transform-origin: 160px 115px;
    transition: transform 0.65s cubic-bezier(0.18, 1.24, 0.35, 1), opacity 0.45s ease;
}

.gift-box-group {
    transform-origin: 160px 265px;
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

.inner-beam {
    opacity: 0;
    transform-origin: 160px 135px;
    transform: scaleY(0.15);
    transition: opacity 0.32s ease, transform 0.5s cubic-bezier(0.22, 1, 0.36, 1);
}

.gift-svg.opening {
    animation: none;
    filter:
        drop-shadow(0 0 42px rgba(255, 216, 92, 0.9))
        drop-shadow(0 20px 32px rgba(0, 0, 0, 0.75));
}

.gift-svg.opening .gift-box-group {
    transform: scale(1.03, 0.96);
}

.gift-svg.opening .gift-lid-group {
    transform: translate(-18px, -78px) rotate(-17deg) scale(1.02);
    opacity: 0.95;
}

.gift-svg.opening .inner-beam {
    opacity: 1;
    transform: scaleY(1.2);
}

.cta-pill {
    position: relative;
    overflow: hidden;
    margin-top: 12px;
    padding: 12px 30px;
    border-radius: 999px;
    background: linear-gradient(135deg, #ffe98e 0%, #ffb923 50%, #df8d09 100%);
    color: #241300;
    font-size: 14px;
    font-weight: 900;
    letter-spacing: 1.8px;
    text-transform: uppercase;
    box-shadow:
        0 8px 24px rgba(255, 184, 30, 0.38),
        inset 0 1px 1px rgba(255, 255, 255, 0.75);
    transition: box-shadow 0.3s ease;
}

.gift-button:hover .cta-pill {
    box-shadow:
        0 10px 30px rgba(255, 198, 56, 0.62),
        inset 0 1px 1px rgba(255, 255, 255, 0.9);
}

.cta-pill::after {
    content: "";
    position: absolute;
    top: 0;
    left: -120%;
    width: 70%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.65), transparent);
    transform: skewX(-22deg);
    animation: ctaShine 3.2s ease-in-out infinite;
}

.hint {
    margin-top: 6px;
    padding: 14px 18px;
    border: 1px solid rgba(255, 211, 77, 0.2);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
    backdrop-filter: blur(10px);
    border-radius: 14px;
    color: #b7b0a4;
    font-size: 13px;
    line-height: 1.5;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
}

.hint span {
    color: var(--gold-300);
    font-weight: 700;
}

@keyframes floatGift {
    0%, 100% { transform: translateY(0px) rotate(-0.8deg); }
    50% { transform: translateY(-13px) rotate(1deg); }
}

@keyframes shadowSync {
    0%, 100% { transform: scale(1); opacity: 0.85; }
    50% { transform: scale(0.82); opacity: 0.42; }
}

@keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

@keyframes glowPulse {
    0%, 100% { transform: scale(0.95); opacity: 0.75; }
    50% { transform: scale(1.1); opacity: 1; }
}

@keyframes ctaShine {
    0%, 55% { left: -120%; }
    100% { left: 150%; }
}

@media (prefers-reduced-motion: reduce) {
    .gift-svg, .floor-shadow, .aura-rays, .aura-glow, .cta-pill::after {
        animation: none;
    }
}
</style>
</head>

<body>

<canvas id="fx-canvas" aria-hidden="true"></canvas>
<div class="screen-flash" id="screenFlash" aria-hidden="true"></div>

<main class="container">
    <div class="badge">✨ Surpresa Desbloqueada</div>

    <h1>Tem um <span>presente</span> para você!</h1>

    <p class="subtitle">
        Preparamos algo exclusivo para você.
        Toque na caixa abaixo para abrir agora!
    </p>

    <div class="gift-stage">
        <div class="aura-rays" aria-hidden="true"></div>
        <div class="aura-glow" aria-hidden="true"></div>

        <button
            type="button"
            class="gift-button"
            id="giftButton"
            aria-label="Abrir presente especial"
        >
            <div class="gift-wrapper">
                <svg
                    class="gift-svg"
                    id="giftSvg"
                    viewBox="0 0 320 300"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                >
                    <defs>
                        <!-- Ouro da face esquerda (iluminada) -->
                        <linearGradient id="boxLeftGold" x1="68" y1="128" x2="160" y2="274" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFE68B"/>
                            <stop offset="45%" stop-color="#E7AC28"/>
                            <stop offset="100%" stop-color="#9A6106"/>
                        </linearGradient>

                        <!-- Ouro da face direita (sombreada para volume 3D) -->
                        <linearGradient id="boxRightGold" x1="160" y1="170" x2="252" y2="232" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#C98A16"/>
                            <stop offset="55%" stop-color="#9A6008"/>
                            <stop offset="100%" stop-color="#6B3F02"/>
                        </linearGradient>

                        <!-- Ouro da tampa superior -->
                        <linearGradient id="lidTopGold" x1="60" y1="98" x2="260" y2="98" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFF2AE"/>
                            <stop offset="45%" stop-color="#F7C948"/>
                            <stop offset="100%" stop-color="#C98712"/>
                        </linearGradient>

                        <linearGradient id="lidLeftGold" x1="60" y1="98" x2="160" y2="178" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFE997"/>
                            <stop offset="100%" stop-color="#C88712"/>
                        </linearGradient>

                        <linearGradient id="lidRightGold" x1="160" y1="144" x2="260" y2="132" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#B8790E"/>
                            <stop offset="100%" stop-color="#704202"/>
                        </linearGradient>

                        <!-- Fita vermelha cetim (iluminada vs sombreada) -->
                        <linearGradient id="ribbonLight" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#FF4742"/>
                            <stop offset="50%" stop-color="#D11018"/>
                            <stop offset="100%" stop-color="#8A040A"/>
                        </linearGradient>

                        <linearGradient id="ribbonDark" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#B80B12"/>
                            <stop offset="100%" stop-color="#580003"/>
                        </linearGradient>

                        <linearGradient id="ribbonTop" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#FF5C54"/>
                            <stop offset="50%" stop-color="#DF1620"/>
                            <stop offset="100%" stop-color="#9A060D"/>
                        </linearGradient>

                        <!-- Gradientes do Laço Realista -->
                        <linearGradient id="bowOuterLeft" x1="80" y1="62" x2="155" y2="98" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF6B62"/>
                            <stop offset="45%" stop-color="#DC141E"/>
                            <stop offset="100%" stop-color="#7D0308"/>
                        </linearGradient>

                        <linearGradient id="bowOuterRight" x1="240" y1="62" x2="165" y2="98" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#F22929"/>
                            <stop offset="55%" stop-color="#B50A12"/>
                            <stop offset="100%" stop-color="#5C0004"/>
                        </linearGradient>

                        <linearGradient id="bowUpperLeft" x1="108" y1="45" x2="154" y2="92" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF5952"/>
                            <stop offset="60%" stop-color="#C90E17"/>
                            <stop offset="100%" stop-color="#6B0105"/>
                        </linearGradient>

                        <linearGradient id="bowUpperRight" x1="212" y1="45" x2="166" y2="92" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#E62222"/>
                            <stop offset="60%" stop-color="#A8070F"/>
                            <stop offset="100%" stop-color="#540003"/>
                        </linearGradient>

                        <linearGradient id="bowInsideDark" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#290001"/>
                            <stop offset="100%" stop-color="#6E0206"/>
                        </linearGradient>

                        <linearGradient id="knotGrad" x1="146" y1="76" x2="174" y2="104" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FF6F66"/>
                            <stop offset="50%" stop-color="#D41019"/>
                            <stop offset="100%" stop-color="#5E0004"/>
                        </linearGradient>

                        <linearGradient id="tailLeftGrad" x1="154" y1="98" x2="126" y2="168" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#C90E17"/>
                            <stop offset="55%" stop-color="#F53833"/>
                            <stop offset="100%" stop-color="#870409"/>
                        </linearGradient>

                        <linearGradient id="tailRightGrad" x1="166" y1="98" x2="192" y2="166" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#A8070E"/>
                            <stop offset="55%" stop-color="#D6141C"/>
                            <stop offset="100%" stop-color="#630004"/>
                        </linearGradient>

                        <!-- Interior da caixa quando abre + feixe de luz -->
                        <radialGradient id="cavityGlow" cx="50%" cy="55%" r="55%">
                            <stop offset="0%" stop-color="#FFFBE0"/>
                            <stop offset="55%" stop-color="#FFD048"/>
                            <stop offset="100%" stop-color="#703B00"/>
                        </radialGradient>

                        <linearGradient id="beamGrad" x1="160" y1="140" x2="160" y2="-15" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#FFFCE6" stop-opacity="0.95"/>
                            <stop offset="48%" stop-color="#FFD24C" stop-opacity="0.5"/>
                            <stop offset="100%" stop-color="#FFD24C" stop-opacity="0"/>
                        </linearGradient>
                    </defs>

                    <!-- CORPO DA CAIXA 3D -->
                    <g class="gift-box-group">
                        <!-- Interior da caixa (fica escondido sob a tampa e aparece ao abrir) -->
                        <polygon points="160,86 252,128 160,170 68,128" fill="#5E3500"/>
                        <polygon points="160,92 242,128 160,164 78,128" fill="url(#cavityGlow)"/>

                        <!-- Face esquerda da caixa -->
                        <polygon points="68,128 160,170 160,274 68,232" fill="url(#boxLeftGold)"/>
                        <!-- Face direita da caixa -->
                        <polygon points="160,170 252,128 252,232 160,274" fill="url(#boxRightGold)"/>

                        <!-- Brilho sutil na quina frontal 3D -->
                        <line x1="160" y1="170" x2="160" y2="274" stroke="#FFF4BE" stroke-width="1.4" stroke-opacity="0.55"/>

                        <!-- Fita esquerda na caixa + bordas douradas -->
                        <polygon points="101,143 127,155 127,259 101,247" fill="url(#ribbonLight)"/>
                        <line x1="101" y1="143" x2="101" y2="247" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.75"/>
                        <line x1="127" y1="155" x2="127" y2="259" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.75"/>

                        <!-- Fita direita na caixa + bordas douradas -->
                        <polygon points="193,155 219,143 219,247 193,259" fill="url(#ribbonDark)"/>
                        <line x1="193" y1="155" x2="193" y2="259" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.55"/>
                        <line x1="219" y1="143" x2="219" y2="247" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.55"/>

                        <!-- Sombra suave projetada pela tampa fechada -->
                        <polygon points="68,128 160,170 160,187 68,145" fill="#1C0A00" fill-opacity="0.48"/>
                        <polygon points="160,170 252,128 252,145 160,187" fill="#120600" fill-opacity="0.58"/>
                    </g>

                    <!-- FEIXE DE LUZ QUE EXPLODE DE DENTRO DA CAIXA AO ABRIR -->
                    <g class="inner-beam">
                        <polygon points="82,130 238,130 295,-20 25,-20" fill="url(#beamGrad)"/>
                    </g>

                    <!-- TAMPA 3D + LAÇO DE CETIM -->
                    <g class="gift-lid-group">
                        <!-- Borda lateral esquerda da tampa -->
                        <polygon points="60,98 160,144 160,178 60,132" fill="url(#lidLeftGold)"/>
                        <!-- Borda lateral direita da tampa -->
                        <polygon points="160,144 260,98 260,132 160,178" fill="url(#lidRightGold)"/>
                        <!-- Topo da tampa -->
                        <polygon points="60,98 160,52 260,98 160,144" fill="url(#lidTopGold)"/>

                        <!-- Contorno de brilho nas quinas da tampa -->
                        <polyline points="60,98 160,144 260,98" stroke="#FFF8D2" stroke-width="1.4" stroke-opacity="0.7" fill="none"/>
                        <line x1="160" y1="144" x2="160" y2="178" stroke="#FFF6C4" stroke-width="1.3" stroke-opacity="0.5"/>

                        <!-- Fitas cruzadas no topo da tampa -->
                        <polygon points="97,115 197,69 223,81 123,127" fill="url(#ribbonTop)"/>
                        <polygon points="197,127 97,81 123,69 223,115" fill="url(#ribbonTop)"/>

                        <!-- Fitas descendo pelas laterais da tampa -->
                        <polygon points="97,115 123,127 123,161 97,149" fill="url(#ribbonLight)"/>
                        <polygon points="197,127 223,115 223,149 197,161" fill="url(#ribbonDark)"/>

                        <!-- Bordas douradas das fitas na tampa -->
                        <line x1="97" y1="115" x2="97" y2="149" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.8"/>
                        <line x1="123" y1="127" x2="123" y2="161" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.8"/>
                        <line x1="197" y1="127" x2="197" y2="161" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.6"/>
                        <line x1="223" y1="115" x2="223" y2="149" stroke="#FFE99B" stroke-width="1.1" stroke-opacity="0.6"/>

                        <!-- Sombra de contato do laço sobre a tampa -->
                        <ellipse cx="160" cy="99" rx="52" ry="13" fill="#2A0002" fill-opacity="0.45"/>

                        <!-- PONTAS DO LAÇO CAINDO PELA FRENTE DA TAMPA -->
                        <!-- Sombra das pontas -->
                        <path d="M153 102 C140 116, 132 132, 124 166 L133 158 L140 169 C145 142, 150 120, 159 104 Z" fill="#1F0002" fill-opacity="0.45" transform="translate(2,3)"/>
                        <path d="M167 102 C178 116, 186 132, 193 163 L184 156 L176 166 C172 140, 168 120, 161 104 Z" fill="#1F0002" fill-opacity="0.45" transform="translate(2,3)"/>

                        <!-- Ponta esquerda -->
                        <path
                            d="M154 98 C142 110, 134 124, 122 164 L132 156 L140 168 C146 138, 151 116, 159 100 Z"
                            fill="url(#tailLeftGrad)"
                            stroke="#FFE692" stroke-width="0.9" stroke-opacity="0.7"
                        />
                        <!-- Ponta direita -->
                        <path
                            d="M166 98 C178 110, 185 124, 195 162 L185 154 L177 165 C172 136, 168 115, 161 100 Z"
                            fill="url(#tailRightGrad)"
                            stroke="#FFE692" stroke-width="0.9" stroke-opacity="0.55"
                        />

                        <!-- ALÇAS SUPERIORES/TRASEIRAS DO LAÇO (dão volume) -->
                        <!-- Alça superior esquerda -->
                        <path
                            d="M155 86 C140 50, 110 38, 104 58 C100 72, 124 88, 152 91 Z"
                            fill="url(#bowUpperLeft)"
                            stroke="#FFE692" stroke-width="0.9" stroke-opacity="0.65"
                        />
                        <path
                            d="M148 84 C136 62, 118 54, 114 63 C112 70, 128 82, 147 87 Z"
                            fill="url(#bowInsideDark)"
                        />

                        <!-- Alça superior direita -->
                        <path
                            d="M165 86 C180 50, 210 38, 216 58 C220 72, 196 88, 168 91 Z"
                            fill="url(#bowUpperRight)"
                            stroke="#FFE692" stroke-width="0.9" stroke-opacity="0.5"
                        />
                        <path
                            d="M172 84 C184 62, 202 54, 206 63 C208 70, 192 82, 173 87 Z"
                            fill="url(#bowInsideDark)"
                        />

                        <!-- ALÇAS PRINCIPAIS LATERAIS DO LAÇO (com dobra 3D oca por dentro) -->
                        <!-- Alça principal esquerda -->
                        <path
                            d="M153 89 C125 66, 76 62, 74 86 C72 108, 116 112, 153 97 Z"
                            fill="url(#bowOuterLeft)"
                            stroke="#FFE899" stroke-width="1" stroke-opacity="0.72"
                        />
                        <!-- Cavidade interna da alça esquerda -->
                        <path
                            d="M145 91 C124 76, 92 75, 90 88 C89 99, 118 102, 145 95 Z"
                            fill="url(#bowInsideDark)"
                        />
                        <!-- Brilho de cetim na dobra esquerda -->
                        <path d="M84 78 C98 69, 124 72, 144 85" stroke="#FFA59E" stroke-width="2.4" stroke-linecap="round" stroke-opacity="0.55" fill="none"/>

                        <!-- Alça principal direita -->
                        <path
                            d="M167 89 C195 66, 244 62, 246 86 C248 108, 204 112, 167 97 Z"
                            fill="url(#bowOuterRight)"
                            stroke="#FFE899" stroke-width="1" stroke-opacity="0.55"
                        />
                        <!-- Cavidade interna da alça direita -->
                        <path
                            d="M175 91 C196 76, 228 75, 230 88 C231 99, 202 102, 175 95 Z"
                            fill="url(#bowInsideDark)"
                        />
                        <!-- Brilho de cetim na dobra direita -->
                        <path d="M236 78 C222 69, 196 72, 176 85" stroke="#FF8780" stroke-width="2" stroke-linecap="round" stroke-opacity="0.4" fill="none"/>

                        <!-- NÓ CENTRAL FRANZIDO -->
                        <path
                            d="M148 80 C154 75, 166 75, 172 80 C176 86, 176 94, 172 100 C166 104, 154 104, 148 100 C144 94, 144 86, 148 80 Z"
                            fill="url(#knotGrad)"
                            stroke="#FFE899" stroke-width="1" stroke-opacity="0.78"
                        />
                        <!-- Vincos de tecido no nó -->
                        <path d="M149 86 C156 89, 164 89, 171 86" stroke="#6E0105" stroke-width="1.3" stroke-opacity="0.6" fill="none"/>
                        <path d="M150 93 C157 95, 163 95, 170 93" stroke="#FF9C94" stroke-width="1.1" stroke-opacity="0.45" fill="none"/>
                        <ellipse cx="157" cy="82" rx="5.5" ry="2.6" fill="#FFFFFF" fill-opacity="0.35"/>
                    </g>
                </svg>
            </div>

            <div class="floor-shadow" aria-hidden="true"></div>
            <span class="cta-pill">Abrir Presente</span>
        </button>
    </div>

    <div class="hint">
        🎁 Toque no presente acima para <span>liberar seu acesso imediato!</span>
    </div>
</main>

<script>
const DESTINO = "https://telehotchannel.site";

const giftButton = document.getElementById("giftButton");
const giftSvg = document.getElementById("giftSvg");
const screenFlash = document.getElementById("screenFlash");
const canvas = document.getElementById("fx-canvas");
const ctx = canvas.getContext("2d");

let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;
let abrindo = false;

window.addEventListener("resize", () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

const ambientParticles = Array.from({ length: 34 }, () => ({
    x: Math.random() * width,
    y: Math.random() * height,
    r: Math.random() * 2.2 + 0.8,
    vx: (Math.random() - 0.5) * 0.35,
    vy: -(Math.random() * 0.45 + 0.15),
    alpha: Math.random() * 0.6 + 0.2,
    pulse: Math.random() * Math.PI * 2
}));

const burstParticles = [];
const burstColors = ["#FFF6C9", "#FFD34D", "#FFB41F", "#FF4A4A", "#FFFFFF"];

function spawnBurst(originX, originY) {
    for (let i = 0; i < 70; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = Math.random() * 8.5 + 3;
        burstParticles.push({
            x: originX,
            y: originY,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed - 3.2,
            size: Math.random() * 6 + 3,
            color: burstColors[Math.floor(Math.random() * burstColors.length)],
            alpha: 1,
            rotation: Math.random() * Math.PI * 2,
            vRot: (Math.random() - 0.5) * 0.25,
            gravity: 0.18
        });
    }
}

function animateFX() {
    ctx.clearRect(0, 0, width, height);

    for (const p of ambientParticles) {
        p.x += p.vx;
        p.y += p.vy;
        p.pulse += 0.03;

        if (p.y < -10) {
            p.y = height + 10;
            p.x = Math.random() * width;
        }
        if (p.x < -10) p.x = width + 10;
        if (p.x > width + 10) p.x = -10;

        const currentAlpha = p.alpha * (0.65 + 0.35 * Math.sin(p.pulse));
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 218, 105, ${currentAlpha})`;
        ctx.fill();
    }

    for (let i = burstParticles.length - 1; i >= 0; i--) {
        const b = burstParticles[i];
        b.x += b.vx;
        b.y += b.vy;
        b.vy += b.gravity;
        b.vx *= 0.985;
        b.rotation += b.vRot;
        b.alpha -= 0.015;

        if (b.alpha <= 0) {
            burstParticles.splice(i, 1);
            continue;
        }

        ctx.save();
        ctx.translate(b.x, b.y);
        ctx.rotate(b.rotation);
        ctx.globalAlpha = b.alpha;
        ctx.fillStyle = b.color;
        ctx.fillRect(-b.size / 2, -b.size / 3, b.size, b.size * 0.65);
        ctx.restore();
    }

    requestAnimationFrame(animateFX);
}

animateFX();

giftButton.addEventListener("click", () => {
    if (abrindo) return;
    abrindo = true;

    const rect = giftSvg.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height * 0.42;

    giftSvg.classList.add("opening");
    spawnBurst(centerX, centerY);

    setTimeout(() => {
        screenFlash.classList.add("active");
    }, 340);

    setTimeout(() => {
        window.location.assign(DESTINO);
    }, 700);
});
</script>

</body>
